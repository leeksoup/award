langcode: en
status: true
dependencies:
  config:
    - field.storage.lms_activity.rubric_checks
    - lms.lms_activity_type._bundle_placeholder_
  module:
    - lms_free_text_model
id: lms_activity._bundle_placeholder_.rubric_checks
field_name: rubric_checks
entity_type: lms_activity
bundle: _bundle_placeholder_
label: Rubric checks
description: Up to five weighted checks. Blank patterns are skipped. Labels and patterns
  are not shown to students.
required: false
translatable: false
default_value:
  - label: Verse reference
    mode: regex
    pattern: \b([1-3]\s?)?[A-Z][a-z]+\.?\s\d+:\d+
    weight: 1
    nudge: Try backing this up with a verse from the Compiled Evidence page.
  - label: Key word
    mode: phrases
    pattern: ''
    weight: 1
    nudge: Make sure you address the objection directly.
  - label: Question back
    mode: regex
    pattern: \?
    weight: 1
    nudge: Good apologetics often ends with a question back to the person. Can you
      add one?
default_value_callback: ''
settings: {  }
field_type: model_response_rubric_check
