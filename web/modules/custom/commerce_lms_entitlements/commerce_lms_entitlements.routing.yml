commerce_lms_entitlements.webhook:
  path: '/commerce-lms-entitlements/paypal/webhook/{commerce_payment_gateway}'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\PayPalWebhookController::receive'
  requirements:
    _access: 'TRUE'
  methods: [POST]

commerce_lms_entitlements.claim:
  path: '/commerce-lms-entitlements/invitation/{token}'
  defaults:
    _form: '\Drupal\commerce_lms_entitlements\Form\ClaimInvitationForm'
    _title: 'Claim course invitation'
  requirements:
    _access: 'TRUE'

commerce_lms_entitlements.my_subscriptions:
  path: '/my-lms-subscriptions'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\EntitlementController::mine'
    _title: 'My course subscriptions'
  requirements:
    _permission: 'view own commerce lms entitlements'

commerce_lms_entitlements.cancel:
  path: '/my-lms-subscriptions/{eid}/cancel'
  defaults:
    _form: '\Drupal\commerce_lms_entitlements\Form\CancelEntitlementForm'
    _title: 'Cancel course subscription'
  requirements:
    _permission: 'cancel own commerce lms entitlements'
    eid: '\d+'

commerce_lms_entitlements.admin:
  path: '/admin/commerce/lms-entitlements'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\EntitlementController::admin'
    _title: 'Commerce LMS entitlements'
  requirements:
    _permission: 'administer commerce lms entitlements'

entity.commerce_lms_offer.collection:
  path: '/admin/commerce/config/lms-offers'
  defaults:
    _entity_list: 'commerce_lms_offer'
    _title: 'LMS offers'
  requirements:
    _permission: 'administer commerce lms offers'

entity.commerce_lms_offer.add_form:
  path: '/admin/commerce/config/lms-offers/add'
  defaults:
    _entity_form: 'commerce_lms_offer.add'
    _title: 'Add LMS offer'
  requirements:
    _permission: 'administer commerce lms offers'

entity.commerce_lms_offer.edit_form:
  path: '/admin/commerce/config/lms-offers/{commerce_lms_offer}'
  defaults:
    _entity_form: 'commerce_lms_offer.edit'
    _title: 'Edit LMS offer'
  requirements:
    _permission: 'administer commerce lms offers'
  options:
    parameters:
      commerce_lms_offer:
        type: 'entity:commerce_lms_offer'

entity.commerce_lms_offer.delete_form:
  path: '/admin/commerce/config/lms-offers/{commerce_lms_offer}/delete'
  defaults:
    _entity_form: 'commerce_lms_offer.delete'
    _title: 'Delete LMS offer'
  requirements:
    _permission: 'administer commerce lms offers'
  options:
    parameters:
      commerce_lms_offer:
        type: 'entity:commerce_lms_offer'
