commerce_lms_entitlements.webhook:
  path: '/commerce-lms-entitlements/paypal/webhook/{commerce_payment_gateway}'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\PayPalWebhookController::receive'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    parameters:
      commerce_payment_gateway:
        type: 'entity:commerce_payment_gateway'

commerce_lms_entitlements.claim:
  path: '/commerce-lms-entitlements/invitation/{token}'
  defaults:
    _form: '\Drupal\commerce_lms_entitlements\Form\ClaimInvitationForm'
    _title: 'Claim course invitation'
  requirements:
    _access: 'TRUE'

commerce_lms_entitlements.my_subscriptions:
  path: '/my-lms-subscriptions'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\EntitlementController::mine'
    _title: 'My course subscriptions'
  requirements:
    _permission: 'view own commerce lms entitlements'

commerce_lms_entitlements.cancel:
  path: '/my-lms-subscriptions/{eid}/cancel'
  defaults:
    _form: '\Drupal\commerce_lms_entitlements\Form\CancelEntitlementForm'
    _title: 'Cancel course subscription'
  requirements:
    _permission: 'cancel own commerce lms entitlements'
    eid: '\d+'

commerce_lms_entitlements.change_tier:
  path: '/my-lms-subscriptions/{eid}/change-tier'
  defaults:
    _form: '\Drupal\commerce_lms_entitlements\Form\ChangeTierForm'
    _title: 'Change VIP tier'
  requirements:
    _permission: 'change own commerce lms tier'
    eid: '\d+'

commerce_lms_entitlements.plan_change_return:
  path: '/commerce-lms-entitlements/paypal/revision/{token}/complete'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\PlanChangeController::complete'
  requirements:
    _user_is_logged_in: 'TRUE'

commerce_lms_entitlements.plan_change_cancel:
  path: '/commerce-lms-entitlements/paypal/revision/{token}/cancel'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\PlanChangeController::cancel'
  requirements:
    _user_is_logged_in: 'TRUE'

commerce_lms_entitlements.vip_sessions:
  path: '/vip-sessions'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\VipSessionController::page'
    _title: 'VIP live sessions'
  requirements:
    _permission: 'book own vip sessions'

commerce_lms_entitlements.vip_booking_cancel:
  path: '/vip-sessions/{month}/cancel'
  defaults:
    _form: '\Drupal\commerce_lms_entitlements\Form\VipBookingCancelForm'
    _title: 'Cancel VIP session'
  requirements:
    _permission: 'book own vip sessions'
    month: '\d{4}-\d{2}'

commerce_lms_entitlements.vip_settings:
  path: '/admin/commerce/config/lms-vip'
  defaults:
    _form: '\Drupal\commerce_lms_entitlements\Form\VipSettingsForm'
    _title: 'LMS VIP settings'
  requirements:
    _permission: 'administer vip sessions'

commerce_lms_entitlements.admin:
  path: '/admin/commerce/lms-entitlements'
  defaults:
    _controller: '\Drupal\commerce_lms_entitlements\Controller\EntitlementController::admin'
    _title: 'Commerce LMS entitlements'
  requirements:
    _permission: 'administer commerce lms entitlements'

entity.commerce_lms_offer.collection:
  path: '/admin/commerce/config/lms-offers'
  defaults:
    _entity_list: 'commerce_lms_offer'
    _title: 'LMS offers'
  requirements:
    _permission: 'administer commerce lms offers'

entity.commerce_lms_offer.add_form:
  path: '/admin/commerce/config/lms-offers/add'
  defaults:
    _entity_form: 'commerce_lms_offer.add'
    _title: 'Add LMS offer'
  requirements:
    _permission: 'administer commerce lms offers'

entity.commerce_lms_offer.edit_form:
  path: '/admin/commerce/config/lms-offers/{commerce_lms_offer}'
  defaults:
    _entity_form: 'commerce_lms_offer.edit'
    _title: 'Edit LMS offer'
  requirements:
    _permission: 'administer commerce lms offers'
  options:
    parameters:
      commerce_lms_offer:
        type: 'entity:commerce_lms_offer'

entity.commerce_lms_offer.delete_form:
  path: '/admin/commerce/config/lms-offers/{commerce_lms_offer}/delete'
  defaults:
    _entity_form: 'commerce_lms_offer.delete'
    _title: 'Delete LMS offer'
  requirements:
    _permission: 'administer commerce lms offers'
  options:
    parameters:
      commerce_lms_offer:
        type: 'entity:commerce_lms_offer'

entity.commerce_lms_subscription_campaign.collection:
  path: '/admin/commerce/config/lms-subscription-campaigns'
  defaults:
    _entity_list: 'commerce_lms_subscription_campaign'
    _title: 'LMS subscription campaigns'
  requirements:
    _permission: 'administer commerce lms subscription campaigns'

entity.commerce_lms_subscription_campaign.add_form:
  path: '/admin/commerce/config/lms-subscription-campaigns/add'
  defaults:
    _entity_form: 'commerce_lms_subscription_campaign.add'
    _title: 'Add LMS subscription campaign'
  requirements:
    _permission: 'administer commerce lms subscription campaigns'

entity.commerce_lms_subscription_campaign.edit_form:
  path: '/admin/commerce/config/lms-subscription-campaigns/{commerce_lms_subscription_campaign}'
  defaults:
    _entity_form: 'commerce_lms_subscription_campaign.edit'
    _title: 'Edit LMS subscription campaign'
  requirements:
    _permission: 'administer commerce lms subscription campaigns'
  options:
    parameters:
      commerce_lms_subscription_campaign:
        type: 'entity:commerce_lms_subscription_campaign'

entity.commerce_lms_subscription_campaign.delete_form:
  path: '/admin/commerce/config/lms-subscription-campaigns/{commerce_lms_subscription_campaign}/delete'
  defaults:
    _entity_form: 'commerce_lms_subscription_campaign.delete'
    _title: 'Delete LMS subscription campaign'
  requirements:
    _permission: 'administer commerce lms subscription campaigns'
  options:
    parameters:
      commerce_lms_subscription_campaign:
        type: 'entity:commerce_lms_subscription_campaign'
