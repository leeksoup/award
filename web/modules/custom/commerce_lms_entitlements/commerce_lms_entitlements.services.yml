services:
  logger.channel.commerce_lms_entitlements:
    parent: logger.channel_base
    arguments: ['commerce_lms_entitlements']
  commerce_lms_entitlements.membership_manager:
    class: Drupal\commerce_lms_entitlements\EntitlementMembershipManager
    arguments: ['@database', '@entity_type.manager', '@datetime.time']
  commerce_lms_entitlements.manager:
    class: Drupal\commerce_lms_entitlements\EntitlementManager
    arguments: ['@database', '@entity_type.manager', '@commerce_lms_entitlements.membership_manager', '@config.factory', '@queue', '@datetime.time', '@logger.channel.commerce_lms_entitlements', '@commerce_paypal_subscriptions.checkout_sdk_factory', '@Drupal\commerce_lms_entitlements\Mailer\EntitlementMailerInterface', '@url_generator']
  Drupal\commerce_lms_entitlements\Mailer\EntitlementMailerInterface:
    class: Drupal\commerce_lms_entitlements\Mailer\EntitlementMailer
    autowire: true
    autoconfigure: true
  commerce_lms_entitlements.paypal_operations:
    class: Drupal\commerce_lms_entitlements\PayPalSubscriptionOperations
    arguments: ['@http_client']
  commerce_lms_entitlements.paypal_plan_catalog:
    class: Drupal\commerce_lms_entitlements\PayPalPlanCatalog
    arguments: ['@entity_type.manager', '@commerce_lms_entitlements.paypal_operations']
  commerce_lms_entitlements.paypal_campaign_plan_manager:
    class: Drupal\commerce_lms_entitlements\PayPalCampaignPlanManager
    arguments: ['@entity_type.manager', '@commerce_lms_entitlements.paypal_operations', '@commerce_lms_entitlements.paypal_plan_catalog', '@state']
  commerce_lms_entitlements.paypal_vip_plan_manager:
    class: Drupal\commerce_lms_entitlements\PayPalVipPlanManager
    arguments: ['@entity_type.manager', '@commerce_lms_entitlements.paypal_operations', '@commerce_lms_entitlements.paypal_plan_catalog', '@state']
  commerce_lms_entitlements.subscription_campaign_resolver:
    class: Drupal\commerce_lms_entitlements\SubscriptionCampaignResolver
    arguments: ['@entity_type.manager']
  commerce_lms_entitlements.subscription_checkout_snapshot:
    class: Drupal\commerce_lms_entitlements\SubscriptionCheckoutSnapshot
    arguments: ['@entity_type.manager']
  commerce_lms_entitlements.subscription_checkout_recovery:
    class: Drupal\commerce_lms_entitlements\SubscriptionCheckoutRecovery
    arguments: ['@entity_type.manager', '@commerce_lms_entitlements.manager', '@commerce_lms_entitlements.subscription_checkout_snapshot', '@commerce_lms_entitlements.paypal_operations', '@lock', '@commerce_payment.order_updater']
  commerce_lms_entitlements.route_subscriber:
    class: Drupal\commerce_lms_entitlements\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  commerce_lms_entitlements.plan_change_manager:
    class: Drupal\commerce_lms_entitlements\PlanChangeManager
    arguments: ['@database', '@entity_type.manager', '@datetime.time', '@commerce_lms_entitlements.manager', '@commerce_lms_entitlements.paypal_operations']
  commerce_lms_entitlements.vip_booking_manager:
    class: Drupal\commerce_lms_entitlements\VipBookingManager
    arguments: ['@database', '@entity_type.manager', '@config.factory', '@datetime.time', '@lock', '@recurring_events_registration.creation_service', '@Drupal\commerce_lms_entitlements\Mailer\EntitlementMailerInterface']
  commerce_lms_entitlements.plan_subscriber:
    class: Drupal\commerce_lms_entitlements\EventSubscriber\PayPalPlanSubscriber
    arguments: ['@commerce_lms_entitlements.manager', '@commerce_lms_entitlements.subscription_campaign_resolver', '@commerce_lms_entitlements.subscription_checkout_snapshot']
    tags:
      - { name: event_subscriber }
  commerce_lms_entitlements.payment_gateway_subscriber:
    class: Drupal\commerce_lms_entitlements\EventSubscriber\PaymentGatewaySubscriber
    arguments: ['@commerce_lms_entitlements.manager']
    tags:
      - { name: event_subscriber }
  commerce_lms_entitlements.vip_order_processor:
    class: Drupal\commerce_lms_entitlements\VipOrderProcessor
    arguments: ['@commerce_lms_entitlements.manager', '@commerce_lms_entitlements.subscription_campaign_resolver']
    tags:
      - { name: commerce_order.order_processor, priority: 110, adjustment_type: fee }
