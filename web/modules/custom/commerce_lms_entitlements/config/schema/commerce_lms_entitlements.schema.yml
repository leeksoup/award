commerce_lms_entitlements.offer.*:
  type: config_entity
  label: 'Commerce LMS offer'
  mapping:
    id: { type: string, label: 'ID' }
    label: { type: label, label: 'Label' }
    variation_id: { type: integer, label: 'Variation ID' }
    purchase_type: { type: string, label: 'Purchase type' }
    payment_gateway_id: { type: string, label: 'Payment gateway ID' }
    paypal_plan_id: { type: string, label: 'PayPal plan ID' }
    paypal_environment: { type: string, label: 'Active PayPal environment' }
    paypal_sandbox_gateway_id: { type: string, label: 'Sandbox PayPal gateway ID' }
    paypal_sandbox_product_id: { type: string, label: 'Sandbox PayPal product ID' }
    paypal_sandbox_plan_id: { type: string, label: 'Sandbox PayPal plan ID' }
    paypal_live_gateway_id: { type: string, label: 'Live PayPal gateway ID' }
    paypal_live_product_id: { type: string, label: 'Live PayPal product ID' }
    paypal_live_plan_id: { type: string, label: 'Live PayPal plan ID' }
    billing_interval: { type: string, label: 'Expected recurring billing interval' }
    vip_enabled: { type: boolean, label: 'VIP upgrade enabled' }
    vip_surcharge_number: { type: string, label: 'VIP surcharge number' }
    vip_surcharge_currency: { type: string, label: 'VIP surcharge currency' }
    paypal_sandbox_vip_plan_id: { type: string, label: 'Sandbox VIP PayPal plan ID' }
    paypal_live_vip_plan_id: { type: string, label: 'Live VIP PayPal plan ID' }
    course_class_map:
      type: sequence
      label: 'Course/Class targets'
      sequence:
        type: mapping
        mapping:
          course_id: { type: integer, label: 'Course ID' }
          class_id: { type: integer, label: 'Class ID' }

commerce_lms_entitlements.vip:
  type: config_object
  label: 'Commerce LMS VIP settings'
  mapping:
    hub_course_id: { type: integer, label: 'VIP hub Course ID' }
    hub_class_id: { type: integer, label: 'VIP hub Class ID' }
    event_series_ids:
      type: sequence
      label: 'Eligible VIP event series IDs'
      sequence:
        type: integer
    meeting_url: { type: string, label: 'Protected meeting URL' }
    change_cutoff_hours: { type: integer, label: 'Booking change cutoff in hours' }
