id: anu_to_lms_paragraph_lesson_checklists
label: 'Anu LMS lesson checklists to LMS no_answer activities'
migration_group: anu_to_lms
migration_tags:
  - achievements_learning
  - paragraph
  - checklist
  - activity

source:
  plugin: anu_lesson_checklist

process:
  type:
    plugin: default_value
    default_value: checklist
  name: title
  status: status
  uid: uid
  created: created
  changed: changed
  field_checklist_body:
    plugin: anu_to_lms_checklist_body
    source:
      - items
      - resources

destination:
  plugin: 'entity:lms_activity'

migration_dependencies: { }
