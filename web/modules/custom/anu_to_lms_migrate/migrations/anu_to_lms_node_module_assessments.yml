id: anu_to_lms_node_module_assessments
label: 'Anu LMS module assessments to LMS lessons'
migration_group: anu_to_lms
migration_tags: [assessment, lesson]

source:
  plugin: anu_assessment_lesson

process:
  lms_lesson_type:
    plugin: default_value
    default_value: lesson
  name: title
  status: status
  uid: uid
  created: created
  changed: changed
  backwards_navigation:
    plugin: default_value
    default_value: true
  activities:
    plugin: sub_process
    source: activities
    process:
      target_id:
        plugin: migration_lookup
        migration:
          - anu_to_lms_paragraph_assessment_questions
          - anu_to_lms_paragraph_lesson_sections
        source: paragraph_id
        no_stub: true
      data/max_score:
        plugin: default_value
        default_value: 1

destination:
  plugin: 'entity:lms_lesson'

migration_dependencies:
  required:
    - anu_to_lms_paragraph_assessment_questions
    - anu_to_lms_paragraph_lesson_sections
