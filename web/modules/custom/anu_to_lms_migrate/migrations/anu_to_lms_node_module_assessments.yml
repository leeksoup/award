id: anu_to_lms_node_module_assessments
label: 'Anu LMS module assessments to LMS activity-set staging'
migration_group: anu_to_lms
migration_tags:
  - achievements_learning
  - node
  - assessment
  - activity

source:
  # TODO: Replace with your source plugin once implementation starts.
  plugin: embedded_data
  data_rows: []
  ids:
    nid:
      type: integer

process:
  nid: nid
  title: title
  status:
    plugin: default_value
    default_value: 1
  assessment_items: field_module_assessment_items
  assessment_item_plugin_types:
    # Initial question-type -> LMS plugin mapping scaffold.
    plugin: static_map
    source: assessment_question_bundle
    map:
      question_single_choice: select
      question_multi_choice: select
      question_short_answer: free_text
      question_long_answer: free_text
      question_scale: custom_or_nearest
      question_likert_scale: custom_or_nearest
    bypass: true

destination:
  # TODO: Swap to final destination plugin/entity once schema is finalized.
  plugin: null

migration_dependencies:
  required:
    - anu_to_lms_media_files
    - anu_to_lms_taxonomy
