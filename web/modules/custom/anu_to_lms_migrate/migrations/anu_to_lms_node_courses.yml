id: anu_to_lms_node_courses
label: 'Anu LMS courses to LMS courses'
migration_group: anu_to_lms
migration_tags:
  - achievements_learning
  - node
  - course

source:
  plugin: anu_course

process:
  type:
    plugin: default_value
    default_value: lms_course
  label: label
  status: status
  uid: uid
  created: created
  changed: changed
  free_navigation:
    plugin: static_map
    source: linear_progress
    map:
      0: 1
      1: 0
  lessons:
    plugin: sub_process
    source: lessons
    process:
      target_id:
        plugin: migration_lookup
        migration: anu_to_lms_node_module_lessons
        source: nid
        no_stub: true
      data/mandatory:
        plugin: default_value
        default_value: true
      data/required_score:
        plugin: default_value
        default_value: 0
      data/auto_repeat_failed:
        plugin: default_value
        default_value: false
      data/time_limit:
        plugin: default_value
        default_value: 0

destination:
  plugin: 'entity:group'
  default_bundle: lms_course

migration_dependencies:
  required:
    - anu_to_lms_node_module_lessons
