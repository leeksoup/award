id: anu_to_lms_node_module_lessons
label: 'Anu LMS module lessons to LMS lesson staging'
migration_group: anu_to_lms
migration_tags:
  - achievements_learning
  - node
  - lesson

source:
  # TODO: Replace with your source plugin once implementation starts.
  plugin: embedded_data
  data_rows: []
  ids:
    nid:
      type: integer

process:
  nid: nid
  title: title
  status:
    plugin: default_value
    default_value: 1
  lesson_section_source_ids:
    plugin: anu_to_lms_ordered_target_ids
    source: field_module_lesson_content
  lesson_section_ids:
    plugin: migration_lookup
    migration:
      - anu_to_lms_paragraph_lesson_sections
    source: "@lesson_section_source_ids"
    no_stub: true

destination:
  # TODO: Swap to final destination plugin/entity once schema is finalized.
  plugin: null

migration_dependencies:
  required:
    - anu_to_lms_paragraph_lesson_sections
