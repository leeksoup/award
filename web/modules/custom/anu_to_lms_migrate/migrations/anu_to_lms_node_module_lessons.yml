id: anu_to_lms_node_module_lessons
label: 'Anu LMS checklist-bearing module lessons to LMS lessons'
migration_group: anu_to_lms
migration_tags:
  - achievements_learning
  - node
  - lesson

source:
  plugin: anu_checklist_lesson

process:
  lms_lesson_type:
    plugin: default_value
    default_value: lesson
  name: title
  description/value: description
  description/format:
    plugin: default_value
    default_value: minimal_html
  status: status
  uid: uid
  created: created
  changed: changed
  backwards_navigation:
    plugin: default_value
    default_value: true
  activities:
    plugin: sub_process
    source: activities
    process:
      target_id:
        plugin: migration_lookup
        migration:
          - anu_to_lms_paragraph_lesson_checklists
          - anu_to_lms_paragraph_lesson_sections
          - anu_to_lms_paragraph_assessment_questions
        source: paragraph_id
        no_stub: true
      data/max_score:
        plugin: default_value
        default_value: 0

destination:
  plugin: 'entity:lms_lesson'

migration_dependencies:
  required:
    - anu_to_lms_paragraph_lesson_checklists
    - anu_to_lms_paragraph_lesson_sections
    - anu_to_lms_paragraph_assessment_questions
