id: anu_to_lms_paragraph_lesson_sections
label: 'Anu LMS supported lesson section blocks to LMS activities'
migration_group: anu_to_lms
migration_tags:
  - achievements_learning
  - paragraph
  - section
  - activity

source:
  plugin: anu_lesson_section_activity

process:
  type: activity_type
  name: name
  status:
    plugin: default_value
    default_value: 1
  uid:
    plugin: default_value
    default_value: 1
  field_content_body:
    plugin: skip_on_empty
    method: process
    source: body
  field_remote_video/target_id:
    plugin: migration_lookup
    migration: anu_to_lms_media_remote_videos
    source: remote_video_paragraph_id
    no_stub: true
  field_audio_name:
    plugin: skip_on_empty
    method: process
    source: audio_name
  field_audio_file/target_id:
    plugin: skip_on_empty
    method: process
    source: audio_file_id

destination:
  plugin: 'entity:lms_activity'

migration_dependencies:
  required:
    - anu_to_lms_media_remote_videos
